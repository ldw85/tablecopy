<!DOCTYPE html>
<html>
<head>
    <title>Convert SVG Icons to PNG</title>
</head>
<body>
    <h1>Converting SVG icons to PNG... Check the console for progress.</h1>
    <script>
        function svgToPng(svgFile, pngFile, size) {
            return fetch(svgFile)
                .then(response => response.text())
                .then(svgContent => {
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');

                    const img = new Image();
                    const svgBlob = new Blob([svgContent], {type: 'image/svg+xml'});
                    const url = URL.createObjectURL(svgBlob);

                    return new Promise((resolve, reject) => {
                        img.onload = function() {
                            ctx.drawImage(img, 0, 0, size, size);
                            canvas.toBlob(function(blob) {
                                const a = document.createElement('a');
                                a.href = URL.createObjectURL(blob);
                                a.download = pngFile;
                                a.click();
                                URL.revokeObjectURL(url);
                                resolve();
                            });
                        };
                        img.onerror = reject;
                        img.src = url;
                    });
                });
        }

        // Convert all icons
        async function convertAll() {
            const icons = [
                {svg: 'icons/icon16.svg', png: 'icons/icon16.png', size: 16},
                {svg: 'icons/icon32.svg', png: 'icons/icon32.png', size: 32},
                {svg: 'icons/icon48.svg', png: 'icons/icon48.png', size: 48},
                {svg: 'icons/icon128.svg', png: 'icons/icon128.png', size: 128}
            ];

            for (const icon of icons) {
                try {
                    await svgToPng(icon.svg, icon.png, icon.size);
                    console.log(`Converted ${icon.svg} to ${icon.png}`);
                } catch (error) {
                    console.error(`Failed to convert ${icon.svg}:`, error);
                }
            }

            console.log('All icons converted! You can close this window.');
        }

        // Start conversion when page loads
        window.addEventListener('load', convertAll);
    </script>
</body>
</html>
