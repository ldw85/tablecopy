<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">

    <!-- Ezoic Privacy Scripts -->
    <script data-cfasync="false" src="https://cmp.gatekeeperconsent.com/min.js"></script>
    <script data-cfasync="false" src="https://the.gatekeeperconsent.com/cmp.min.js"></script>

    <!-- Ezoic Header Script -->
    <script async src="//www.ezojs.com/ezoic/sa.min.js"></script>
    <script>
        window.ezstandalone = window.ezstandalone || {};
        ezstandalone.cmd = ezstandalone.cmd || [];
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }} | TableCopy Blog</title>
    <meta name="description" content="{{ description }}">
    <meta name="keywords" content="{{ keywords }}">

    <link rel="canonical" href="{{ canonicalUrl }}">
    <link rel="alternate" hreflang="zh" href="{{ zhUrl }}">
    <link rel="alternate" hreflang="en" href="{{ enUrl }}">
    <link rel="alternate" hreflang="x-default" href="{{ enUrl }}">

    <link rel="icon" type="image/png" href="{{ '../assets/tc_icon.png' if depth else '/assets/tc_icon.png' }}">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="{{ '../assets/css/main.css' if depth else '/assets/css/main.css' }}">
    <link rel="stylesheet" href="{{ '../assets/css/blog.css' if depth else '/assets/css/blog.css' }}">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17402862141"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-17402862141');
    </script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="{{ '/' if lang == 'zh' or lang == 'en' else '/' + lang + '/' }}" class="logo">TableCopy</a>
            <div style="display:flex; align-items:center; gap:20px;">
                <ul class="nav-links">
                    <li><a href="{{ '/' if lang == 'zh' or lang == 'en' else '/' + lang + '/' }}">Home</a></li>
                    <li><a href="/blog/">Blog</a></li>
                </ul>
                <select id="lang-switcher" data-current-page="{{ pageId }}" style="font-weight:500; background:transparent; border:1px solid #ddd; border-radius:6px; padding:6px; font-size:15px;">
                    <option value="zh" {% if lang == 'zh' %}selected{% endif %}>中文</option>
                    <option value="en" {% if lang == 'en' %}selected{% endif %}>English</option>
                </select>
            </div>
        </div>
    </nav>

    <main class="blog-main">
        {% if blog_index %}
        <header class="blog-header">
            <div class="container">
                <h1>{{ title }}</h1>
                <p>{{ description }}</p>
            </div>
        </header>
        {% endif %}

        <div class="blog-content">
            {{ content | safe }}
        </div>
    </main>

    <footer class="blog-footer">
        <div class="container">
            <p>&copy; 2025 TableCopy. All rights reserved.</p>
            <p><a href="/">Back to TableCopy</a> | <a href="/blog/">Blog Home</a></p>
        </div>
    </footer>

    <script>
        document.getElementById('lang-switcher').addEventListener('change', function() {
            var lang = this.value;
            var basePath = '/' + (lang === 'en' ? '' : lang + '/');
            var blogPath = '/blog/';
            var articleId = this.dataset.currentPage;
            if (articleId && articleId.indexOf('blog-') === 0) {
                var articleName = articleId.replace('blog-', '');
                window.location.href = basePath + blogPath + articleName + '-' + lang + '.html';
            }
        });
    </script>
</body>
</html>
